<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAND × FIG · Work Progress</title>
<meta name="description" content="A live view of where each project stands today, and what comes next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9F7;
    --card:#FFFFFF;
    --ink:#2B2724;
    --muted:#918980;
    --faint:#B8AFA6;
    --line:#EFE9E3;
    --blush:#C98F87;
    --blush-soft:#F5E7E4;
    --sage:#9FAE9B;
    --radius:18px;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:300;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* The page is a board, not a scroll: everything of the same kind sits on one
     row, and the long stage lists stay folded until they are asked for. */
  .wrap{max-width:1180px;margin:0 auto;padding:64px 28px 48px}

  /* ---- page header ---- */
  .eyebrow{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:0 0 18px;
  }

  h1{
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(32px,5vw,46px);
    line-height:1.12;
    letter-spacing:-.01em;
    margin:0 0 12px;
  }

  .lede{color:var(--muted);font-size:17px;margin:0 0 14px;max-width:52ch}

  .headline{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:28px;flex-wrap:wrap;margin:0 0 44px;
  }

  .headline__stat{text-align:right}

  .headline__stat b{
    display:block;font-family:var(--serif);font-weight:300;font-size:44px;line-height:1;
  }

  .headline__stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

  /* ---- groups ---- */
  .group{margin:0 0 52px}

  .group__head{
    display:flex;align-items:baseline;gap:14px;
    margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line);
  }

  .group__title{
    font-family:var(--serif);font-weight:400;font-size:19px;margin:0;
  }

  .group__count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

  .board{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}

  /* ---- project card ---- */
  .project{
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 24px 20px;scroll-margin-top:24px;
  }

  .project__client{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blush);margin:0 0 8px;font-weight:500;
  }

  .project__title{
    font-family:var(--serif);font-weight:300;font-size:25px;line-height:1.2;margin:0 0 8px;
  }

  .project__note{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px}

  /* ---- meter ---- */
  .meter{margin:0 0 18px}

  .meter__top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}

  .meter__label{font-size:12px;color:var(--muted)}

  .meter__pct{font-family:var(--serif);font-size:20px;color:var(--ink)}

  .meter__track{height:5px;border-radius:99px;background:var(--line);overflow:hidden}

  .meter__fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--sage),var(--blush));
    width:0;
    transition:width 1.1s cubic-bezier(.22,.8,.3,1);
  }

  /* ---- stores inside a card, side by side ---- */
  .stores{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin:0 0 18px}

  .store{
    display:flex;flex-direction:column;gap:6px;
    background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:12px 12px 11px;text-decoration:none;color:inherit;
    transition:border-color .25s ease;
  }

  .store:hover{border-color:var(--blush)}

  .store__name{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:0}

  .store__name::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage);flex:0 0 auto}

  .store--now .store__name::before{background:var(--blush)}

  .store__pct{font-family:var(--serif);font-size:19px;line-height:1;margin:0}

  .store .meter__track{height:3px}

  .store__link{font-size:11px;color:var(--blush);margin:2px 0 0}

  /* ---- now / next ---- */
  .lines{margin:0 0 16px}

  .line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}

  .line__tag{
    flex:0 0 62px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);padding-top:4px;
  }

  .line--now .line__tag{color:var(--blush)}

  .line__body{flex:1 1 auto;min-width:0}

  .line__name{font-size:14px;margin:0}

  .line--now .line__name{font-weight:500}

  .line__note{font-size:12.5px;color:var(--faint);line-height:1.5;margin:2px 0 0}

  /* ---- the journey, folded ---- */
  details{border-top:1px solid var(--line);margin-top:auto}

  summary{
    list-style:none;cursor:pointer;padding:13px 0 0;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }

  summary::-webkit-details-marker{display:none}

  summary::after{content:"+";font-size:14px;letter-spacing:0;color:var(--blush)}

  details[open] summary::after{content:"–"}

  summary:hover{color:var(--muted)}

  .stages{list-style:none;margin:10px 0 4px;padding:0}

  .stage{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}

  .stage:last-child{border-bottom:0}

  .dot{
    flex:0 0 auto;width:9px;height:9px;border-radius:50%;
    margin-top:6px;border:1.5px solid var(--line);background:transparent;
  }

  .stage--done .dot{background:var(--sage);border-color:var(--sage)}

  .stage--now .dot{background:var(--blush);border-color:var(--blush);box-shadow:0 0 0 4px var(--blush-soft)}

  .stage__body{flex:1 1 auto;min-width:0}

  .stage__name{font-size:13.5px;margin:0}

  .stage--done .stage__name{color:var(--muted)}

  .stage--now .stage__name{font-weight:500}

  .stage__note{font-size:12px;color:var(--faint);line-height:1.5;margin:2px 0 0}

  .stage__state{
    flex:0 0 auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);padding-top:4px;
  }

  .stage--done .stage__state{color:var(--sage)}

  .stage--now .stage__state{color:var(--blush)}

  /* ---- preview link ---- */
  .preview{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-top:1px solid var(--line);margin-top:4px;padding-top:13px;
    text-decoration:none;color:inherit;
  }

  .preview__title{font-size:12.5px;margin:0;color:var(--muted)}

  .preview:hover .preview__title{color:var(--ink)}

  .preview__arrow{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--line);display:grid;place-items:center;
    color:var(--blush);font-size:13px;
  }

  .preview:hover .preview__arrow{border-color:var(--blush)}

  /* ---- footer ---- */
  footer{
    border-top:1px solid var(--line);padding-top:22px;
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;flex-wrap:wrap;
  }

  .updated{font-size:11.5px;color:var(--faint);margin:0}

  .by{font-size:11px;color:var(--faint);margin:0}

  .by a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}

  .by a:hover{color:var(--blush);border-bottom-color:var(--blush)}

  @media (max-width:760px){
    .wrap{padding:44px 20px 40px}
    .headline{gap:18px}
    .headline__stat{text-align:left}
    .board{grid-template-columns:1fr}
    .stage__state{display:none}
  }

  @media (max-width:420px){
    .stores{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    .meter__fill{transition:none}
    .store{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="headline">
    <div>
      <p class="eyebrow">BAND × FIG · Work progress</p>
      <h1>Where every project stands</h1>
      <p class="lede">Websites first, then the mobile apps. Open a card's journey to see every stage.</p>
    </div>
    <div class="headline__stat">
      <b id="overall">—</b>
      <span>Across all projects</span>
    </div>
  </div>

  <div id="groups"></div>

  <footer>
    <p class="updated">Last updated <span id="updated"></span></p>
    <p class="by">Built by <a href="https://band-agents.github.io/band/" target="_blank" rel="noopener">BAND</a></p>
  </footer>

</div>

<script>
  /* Single source of truth. To update progress, change a stage's `state` and
     adjust UPDATED. States: "done" | "now" | "todo".
     `group` decides which row a project sits on. */
  const UPDATED = "22 September 2026";

  const GROUPS = [
    { id: "sites", title: "Online stores" },
    { id: "apps",  title: "Mobile apps" }
  ];

  const PROJECTS = [
    {
      id: "womensecret",
      group: "sites",
      client: "Women'secret",
      title: "Three stores",
      note: "One build, shared by three stores. Every improvement reaches all three; each store then gets its own currency, branches and local details.",
      /* The per-country stage. Its state is the only thing that differs between stores. */
      country: { name: "Country set-up", note: "Currency, branches, contact details, delivery and local content for each country." },
      markets: [
        { name: "Egypt",  state: "done", status: "Set up for Egypt: pounds, both Cairo branches and local details.",
          url: "https://gcrmsf-rh.myshopify.com/?preview_theme_id=164935696599" },
        { name: "Jordan", state: "now",  status: "The full store is copied across. Currency and Jordan's local details are next.",
          url: "https://d0kb1v-p9.myshopify.com/?_ab=0&_fd=0&_sc=1&key=2a0c0a0245b5c33c33581bf089f81158a936294a4f93c6397221a3a0142c89ec&preview_theme_id=160076464228" },
        { name: "Kuwait", state: "now",  status: "The full store is copied across. Currency and Kuwait's local details are next.",
          url: "https://qxc3f7-2n.myshopify.com/?_ab=0&_fd=0&_sc=1&key=ca2fef284168ba415b7ec7608bc219ade7f5c57efb2823c1efb33c301144b811&preview_theme_id=153370493124" }
      ],
      stages: [
        { name: "Design study",         note: "Measuring the reference store, down to spacing and type.",                  state: "done" },
        { name: "Visual foundations",   note: "Typefaces, colour and spacing set up as one system.",                       state: "done" },
        { name: "Store structure",      note: "All 16 categories and every navigation menu created.",                      state: "done" },
        { name: "Header & navigation",  note: "Top bar, logo, category menu and full dropdown menu, on desktop and phone.", state: "done" },
        { name: "Homepage",             note: "Built on desktop and phone with the current campaign artwork.",             state: "done" },
        { name: "Category pages",       note: "Product grids, quick add to basket, colour swatches, filters and sorting, on desktop and phone.", state: "done" },
        { name: "Product page",         note: "Gallery, colours, sizes, add to basket and \"Complete your look\", on desktop and phone.", state: "done" },
        { name: "Basket & checkout",    note: "Basket built and working; checkout branding next.",                         state: "now"  },
        { name: "Footer & information", note: "Footer, FAQs, customer service, store finder with map and the Club WOW page in place.", state: "done" },
        { name: "Polish & handover",    note: "Phone testing, final pass, and walking you through it.",                    state: "todo" }
      ]
    },
    {
      id: "fig-store",
      group: "sites",
      client: "FIG",
      title: "FIG online store",
      note: "figeg.com rebuilt on Shopify, in the Bazaar look: a marketplace layout with rails, a flash-sale strip and recommendations throughout.",
      preview: { title: "The design we are building from", url: "https://band-agents.github.io/fig-website-directions/bazaar/" },
      stages: [
        { name: "Project setup",            note: "The Shopify store is set up and ready to develop on.",                  state: "done" },
        { name: "Design",                   note: "The Bazaar look built as a working theme: typefaces, colour, spacing and every component, on desktop and phone.", state: "done" },
        { name: "Homepage",                 note: "Hero, categories, flash sale, offers, brands, shop-the-look and the recommendation rows, uploaded to the store as a draft theme.", state: "done" },
        { name: "Category & product pages", note: "Product grids with filters and sorting, and the product page with gallery, colours, sizes and quick add.", state: "done" },
        { name: "Basket & recommendations", note: "Basket with free-delivery progress, \"goes with your bag\" suggestions, and buy-it-together bundles.", state: "done" },
        { name: "Product catalogue",        note: "The whole of figeg.com is exported and checked: 6,730 products, 26,829 sizes and colours, 1,706 customers, 254 orders, 246 categories. Bringing it into Shopify is next.", state: "now"  },
        { name: "Payments & delivery",      note: "Payment methods and shipping set up.",                                  state: "todo" },
        { name: "Stock connection",         note: "Stock kept in step with the warehouse system.",                         state: "todo" },
        { name: "Testing & launch",         note: "Final checks on desktop and phone, then going live.",                   state: "todo" }
      ]
    },
    {
      id: "labesny-store",
      group: "sites",
      client: "Labesny",
      title: "Labesny online store",
      note: "labesny.com rebuilt in the Pulse look: blush colour blocks, bold display type and the same recommendation layer as the FIG store.",
      preview: { title: "See it on the store", url: "https://szk0ey-ns.myshopify.com/?preview_theme_id=166531825795" },
      stages: [
        { name: "Design direction",         note: "The Pulse look, with the palette tuned to Labesny's own blush, black and cream.", state: "done" },
        { name: "Design",                   note: "Typefaces, colour and spacing built as one system, on desktop and phone.", state: "done" },
        { name: "Homepage",                 note: "Split colour hero, categories, new in, the brand band, trending, shop-the-look and the recommendation rows — live on the store's draft theme with your real products.", state: "done" },
        { name: "Category & product pages", note: "Product grids with filters and sorting, and the product page with gallery, colours, sizes and quick add.", state: "done" },
        { name: "Basket & recommendations", note: "Basket with free-delivery progress, \"goes with your bag\" suggestions, and buy-it-together bundles.", state: "done" },
        { name: "Content & imagery",        note: "Campaign photography, category images and the wording for each row.",  state: "now"  },
        { name: "Arabic",                   note: "The store in Arabic, right to left.",                                   state: "todo" },
        { name: "Testing & launch",         note: "Final checks on desktop and phone, then going live.",                   state: "todo" }
      ]
    },
    {
      id: "labesny-app",
      group: "apps",
      client: "Labesny",
      title: "Mobile app · Labesny",
      note: "The Labesny store as an iOS and Android app, with its own look rather than the website's: warm paper, deep ink and a clay accent. English and Arabic throughout, prices in Kuwaiti dinar.",
      stages: [
        { name: "Design direction",       note: "The app's own look and motion, set up as one system so every screen matches.",               state: "done" },
        { name: "Backend",                note: "Store, prices in Kuwaiti dinar, delivery rules, orders and customer accounts, built and tested on Medusa.", state: "done" },
        { name: "App screens & build",    note: "Every screen: home, shop, product, bag, checkout, account, saved, the club, and all the information and legal pages — in English and Arabic, right to left.", state: "done" },
        { name: "Recommendations",        note: "Suggestions on the home page, the product page and the bag, blended from several signals at once and set by you rather than fixed in the app. Checked against your real catalogue.", state: "done" },
        { name: "Saved items & the club", note: "Saved items follow the customer from their phone to their account, and points are earned automatically when an order is placed.", state: "done" },
        { name: "Account & privacy",      note: "A customer can close their account and have their details erased, in the app or by email, as Google and Apple require. Privacy policy and terms published.", state: "done" },
        { name: "Payments & delivery",    note: "Card and KNET payment is built and creates invoices on MyFatoorah's test system. A full test payment and your live MyFatoorah account come next.", state: "now"  },
        { name: "Live on Medusa Cloud",   note: "The backend is running on your Medusa Cloud project, with the store, a sample catalogue of 278 products, prices, delivery and the admin. Checked end to end: browse, cart, delivery.", state: "done" },
        { name: "Stock connection",       note: "Stock kept in step with the warehouse system.",                                             state: "todo" },
        { name: "Testing",                note: "Every change is checked automatically — 117 checks across the shop and the app, run on each update. An Android build is ready to install; testing on real phones comes next.", state: "now"  },
        { name: "App store release",      note: "Submitted to the App Store and Google Play.",                                               state: "todo" }
      ]
    },
    {
      id: "fig-fashion-app",
      group: "apps",
      client: "FIG",
      title: "Mobile app · FIG Fashion Website",
      note: "The FIG fashion website as an iOS and Android app. Its own backend, its own catalogue.",
      stages: [
        { name: "Backend",             note: "Store in Egyptian pounds, a sample catalogue of 300 products from figeg.com (15 brands, sale prices), delivery rules and the admin, running on its own Medusa Cloud project. Checked end to end: browse, cart, delivery.", state: "done" },
        { name: "Design",              note: "App screens and flows.",                                                          state: "todo" },
        { name: "Build",               note: "The app built and connected to the store.",                                       state: "todo" },
        { name: "Payments & delivery", note: "Payment methods and delivery set up.",                                            state: "todo" },
        { name: "Stock connection",    note: "Stock kept in step with the warehouse system.",                                   state: "todo" },
        { name: "Testing",             note: "Testing on real phones.",                                                         state: "todo" },
        { name: "App store release",   note: "Submitted to the App Store and Google Play.",                                     state: "todo" }
      ]
    }
  ];

  const LABEL = { done: "Complete", now: "In progress", todo: "To come" };

  /* Each stage in progress counts as half, so the bar moves between milestones. */
  const progressOf = (stages) => {
    const done = stages.filter(s => s.state === "done").length;
    const now = stages.filter(s => s.state === "now").length;
    return { done, total: stages.length, pct: Math.round(((done + now * 0.5) / stages.length) * 100) };
  };

  /* A store's own stage list: the shared stages plus its country set-up. */
  const storeStages = (p, m) => [...p.stages, { ...p.country, state: m.state }];

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  const track = (pct, cls) => {
    const t = el("div", "meter__track" + (cls ? " " + cls : ""));
    const fill = el("div", "meter__fill");
    fill.dataset.pct = pct;
    t.append(fill);
    return t;
  };

  const meter = (label, pct) => {
    const box = el("div", "meter");
    const top = el("div", "meter__top");
    top.append(el("span", "meter__label", label), el("span", "meter__pct", pct + "%"));
    box.append(top, track(pct));
    return box;
  };

  const line = (tag, stage, fallback) => {
    const row = el("div", "line" + (tag === "Now" ? " line--now" : ""));
    const body = el("div", "line__body");
    body.append(
      el("p", "line__name", stage ? stage.name : fallback.name),
      el("p", "line__note", stage ? stage.note : fallback.note)
    );
    row.append(el("span", "line__tag", tag), body);
    return row;
  };

  const groupsRoot = document.getElementById("groups");
  const totals = [];

  GROUPS.forEach(g => {
    const items = PROJECTS.filter(p => p.group === g.id);
    if (!items.length) return;

    const section = el("section", "group");
    const head = el("div", "group__head");
    head.append(el("h2", "group__title", g.title), el("span", "group__count", items.length + (items.length === 1 ? " project" : " projects")));
    section.append(head);

    const board = el("div", "board");

    items.forEach(p => {
      const stores = p.markets ? p.markets.map(m => ({ ...m, ...progressOf(storeStages(p, m)) })) : null;
      /* A multi-store project shows the average of its stores; its journey is the shared stages plus the country stage. */
      const countryState = stores ? (stores.every(m => m.state === "done") ? "done" : stores.some(m => m.state !== "todo") ? "now" : "todo") : null;
      const stages = stores
        ? [...p.stages, { ...p.country, state: countryState, note: p.country.note + " " + stores.map(m => m.name + ": " + LABEL[m.state].toLowerCase()).join(" · ") + "." }]
        : p.stages;
      const { done, total } = progressOf(stages);
      const pct = stores ? Math.round(stores.reduce((a, m) => a + m.pct, 0) / stores.length) : progressOf(stages).pct;
      totals.push(pct);

      const now = stages.find(s => s.state === "now");
      const next = stages.find(s => s.state === "todo");

      const card = el("article", "project");
      card.id = p.id;
      card.append(
        el("p", "project__client", p.client),
        el("h3", "project__title", p.title),
        el("p", "project__note", p.note)
      );

      if (stores) {
        const grid = el("div", "stores");
        stores.forEach(m => {
          const store = el("a", "store store--" + m.state);
          store.href = m.url;
          store.target = "_blank";
          store.rel = "noopener";
          store.append(
            el("p", "store__name", m.name),
            el("p", "store__pct", m.pct + "%"),
            track(m.pct),
            el("p", "store__link", "Preview →")
          );
          grid.append(store);
        });
        card.append(grid);
        card.append(meter("Average of the three · " + done + " of " + total + " stages", pct));
      } else {
        card.append(meter(done + " of " + total + " stages complete", pct));
      }

      const lines = el("div", "lines");
      lines.append(
        line("Now", now, { name: done ? "Between stages" : "Not started yet", note: done ? "The next stage starts soon." : "Scheduled after the online store." }),
        line("Next", next, { name: "Handover", note: "Everything on the list is done." })
      );
      card.append(lines);

      const details = el("details");
      const summary = el("summary", null, "The journey · " + done + "/" + total);
      details.append(summary);
      const list = el("ul", "stages");
      stages.forEach(s => {
        const li = el("li", "stage stage--" + s.state);
        const body = el("span", "stage__body");
        body.append(el("p", "stage__name", s.name), el("p", "stage__note", s.note));
        li.append(el("span", "dot"), body, el("span", "stage__state", LABEL[s.state]));
        list.append(li);
      });
      details.append(list);
      card.append(details);

      if (p.preview) {
        const a = el("a", "preview");
        a.href = p.preview.url;
        a.target = "_blank";
        a.rel = "noopener";
        const arrow = el("span", "preview__arrow", "→");
        arrow.setAttribute("aria-hidden", "true");
        a.append(el("p", "preview__title", p.preview.title), arrow);
        card.append(a);
      }

      board.append(card);
    });

    section.append(board);
    groupsRoot.append(section);
  });

  document.getElementById("overall").textContent =
    Math.round(totals.reduce((a, n) => a + n, 0) / totals.length) + "%";
  document.getElementById("updated").textContent = UPDATED;

  requestAnimationFrame(() => {
    document.querySelectorAll(".meter__fill").forEach(f => { f.style.width = f.dataset.pct + "%"; });
  });
</script>
</body>
</html>
